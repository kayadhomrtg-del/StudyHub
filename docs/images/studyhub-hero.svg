      <rect x="58" y="81" width="56" height="5" rx="2.5" fill="#475569"/>
      <rect x="58" y="90" width="39" height="4" rx="2" fill="#CBD5E1"/>
      <rect x="29" y="118" width="86" height="24" rx="7" fill="#DBEAFE"/>
      <rect x="38" y="126" width="7" height="7" rx="2" fill="#3B82F6"/>
