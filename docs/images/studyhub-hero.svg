      <path d="M14 18.5c7.5-2.8 13.2-1.6 17 2.2 3.8-3.8 9.5-5 17-2.2v19c-7.5-2.8-13.2-1.6-17 2.2-3.8-3.8-9.5-5-17-2.2v-19Z" stroke="#0F172A" stroke-width="2.8" stroke-linejoin="round"/>
      <path d="M31 21v19" stroke="#0F172A" stroke-width="2.8"/>
      <text x="72" y="25" fill="#A5F3FC" font-size="13" font-weight="700" letter-spacing="2.1">YOUR PERSONAL STUDY SPACE</text>
      <text x="70" y="77" fill="#F8FAFC" font-size="48" font-weight="750" letter-spacing="-1.5">Study smarter,</text>
      <text x="70" y="132" fill="#67E8F9" font-size="48" font-weight="750" letter-spacing="-1.5">locally.</text>
      <text x="72" y="169" fill="#CBD5E1" font-size="17">Courses, notes, plans and materials — organized on your device.</text>
      <g transform="translate(72 198)">
        <rect width="126" height="31" rx="15.5" fill="#FFFFFF" fill-opacity=".09" stroke="#FFFFFF" stroke-opacity=".14"/>
        <circle cx="17" cy="15.5" r="4" fill="#34D399"/>
        <text x="29" y="20" fill="#E2E8F0" font-size="12" font-weight="600">LOCAL-FIRST</text>
        <rect x="137" width="115" height="31" rx="15.5" fill="#FFFFFF" fill-opacity=".09" stroke="#FFFFFF" stroke-opacity=".14"/>
        <path d="M153 12v7m-3.5-3.5h7" stroke="#A5B4FC" stroke-width="1.8" stroke-linecap="round"/>
        <text x="165" y="20" fill="#E2E8F0" font-size="12" font-weight="600">OFFLINE-READY</text>
        <rect x="263" width="118" height="31" rx="15.5" fill="#FFFFFF" fill-opacity=".09" stroke="#FFFFFF" stroke-opacity=".14"/>
        <path d="M278 12.5h10v7h-10zM281 10h4" stroke="#F0ABFC" stroke-width="1.5" stroke-linejoin="round"/>
        <text x="294" y="20" fill="#E2E8F0" font-size="12" font-weight="600">YOURS TO BACK UP</text>
      </g>
    </g>

