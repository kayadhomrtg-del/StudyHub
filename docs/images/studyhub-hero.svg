<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" fill="none" role="img" aria-labelledby="title description">
  <title id="title">College Study Hub</title>
  <desc id="description">A colorful illustration of a local-first study dashboard with course cards, notes, a planner, and study materials.</desc>
  <defs>
    <linearGradient id="background" x1="70" y1="30" x2="1090" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101A37"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#A7F3D0"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dy="8"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope=".18"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#background)"/>
  <circle cx="1070" cy="50" r="155" fill="#4F46E5" fill-opacity=".12"/>
  <circle cx="150" cy="420" r="210" fill="#06B6D4" fill-opacity=".1"/>
  <path d="M0 335C195 265 310 395 487 345s307-145 452-98 186 63 261 23v150H0V335Z" fill="#0B1229" fill-opacity=".36"/>

