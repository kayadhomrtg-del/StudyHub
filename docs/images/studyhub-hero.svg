        <rect x="53" y="159" width="48" height="4" rx="2"/>
        <rect x="38" y="181" width="8" height="8" rx="2"/>
        <rect x="53" y="183" width="39" height="4" rx="2"/>
        <rect x="38" y="205" width="8" height="8" rx="2"/>
        <rect x="53" y="207" width="45" height="4" rx="2"/>
        <rect x="38" y="229" width="8" height="8" rx="2"/>
        <rect x="53" y="231" width="34" height="4" rx="2"/>
      </g>
      <rect x="147" y="63" width="266" height="58" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="162" y="84" fill="#64748B" font-size="9" font-weight="600" letter-spacing=".8">TUESDAY, 12 MAY</text>
      <text x="162" y="105" fill="#0F172A" font-size="16" font-weight="700">Good afternoon, Alex</text>
      <circle cx="385" cy="92" r="17" fill="#E0E7FF"/>
      <text x="379" y="97" fill="#4338CA" font-size="12" font-weight="700">A</text>

      <rect x="147" y="132" width="128" height="91" rx="10" fill="#EFF6FF"/>
      <rect x="160" y="145" width="24" height="24" rx="8" fill="#DBEAFE"/>
      <path d="M166 151h12v12h-12zM169 148h6" stroke="#2563EB" stroke-width="1.4" stroke-linejoin="round"/>
      <text x="160" y="185" fill="#1E3A8A" font-size="10" font-weight="700">BIOLOGY</text>
      <text x="160" y="201" fill="#64748B" font-size="9">4 materials · 2 notes</text>
      <rect x="285" y="132" width="128" height="91" rx="10" fill="#F5F3FF"/>
      <rect x="298" y="145" width="24" height="24" rx="8" fill="#EDE9FE"/>
      <path d="M304 151c4-2 7-1 9 1 2-2 5-3 9-1v12c-4-2-7-1-9 1-2-2-5-3-9-1v-12Z" stroke="#7C3AED" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M313 152v12" stroke="#7C3AED" stroke-width="1.4"/>
      <text x="298" y="185" fill="#4C1D95" font-size="10" font-weight="700">PSYCHOLOGY</text>
      <text x="298" y="201" fill="#64748B" font-size="9">6 materials · 1 task</text>

      <rect x="147" y="234" width="266" height="63" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="160" y="246" width="30" height="37" rx="7" fill="#ECFDF5"/>
      <text x="166" y="260" fill="#059669" font-size="8" font-weight="700">MAY</text>
      <text x="168" y="276" fill="#065F46" font-size="13" font-weight="700">12</text>
      <text x="202" y="255" fill="#334155" font-size="10" font-weight="700">Review cell structure</text>
      <text x="202" y="270" fill="#64748B" font-size="9">Biology · 25 min</text>
      <rect x="202" y="279" width="104" height="5" rx="2.5" fill="#E2E8F0"/>
